name: Kiểm tra web thenail.vn

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # 08:00 giờ Việt Nam
  workflow_dispatch: {}

jobs:
  kiem-tra:
    name: Chạy bộ kiểm tra tự động
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài phụ thuộc
        run: npm ci || npm install

      - name: Cài trình duyệt Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Chờ GitHub Pages triển khai xong (chỉ khi push)
        if: github.event_name == 'push'
        run: sleep 90

      - name: Chạy bộ kiểm tra trên thenail.vn
        env:
          BASE_URL: https://thenail.vn
        # Không ép --reporter ở đây: để playwright.config.js dùng cả 'list' (đọc ngay
        # trong log) lẫn 'html' (sinh thư mục playwright-report/ để tải lên khi FAIL).
        run: npx playwright test

      - name: Tải lên báo cáo kết quả (playwright-report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
